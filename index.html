<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>upmoney</title>
  <link rel="stylesheet" href="css/app.css?v=4" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="screen" class="screen"></main>

  <nav id="tabbar" class="tabbar">
    <button class="tab active" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Главная</span>
    </button>
    <button class="tab" data-route="top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Топ</span>
    </button>
    <button class="tab" data-route="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="core.js?v=4"></script>
  <script src="api.js?v=4"></script>
  <script src="ui.js?v=4"></script>
  <script src="home.js?v=4"></script>
  <script src="crash.js?v=4"></script>
  <script src="mines.js?v=4"></script>
  <script src="coin.js?v=4"></script>
  <script src="cases.js?v=4"></script>
  <script src="top.js?v=4"></script>
  <script src="profile.js?v=4"></script>
  <script src="main.js?v=4"></script>
</body>
</html>
